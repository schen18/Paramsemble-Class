name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest-github-actions-annotate-failures
      - name: Run tests
        # on failure, append the log tail to the public job summary so the
        # cause is readable without log-download permissions
        run: >-
          pytest tests/ -q --tb=short -ra > pytest.log 2>&1 ||
          (tail -150 pytest.log >> "$GITHUB_STEP_SUMMARY";
           tail -60 pytest.log; exit 1)

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with dev dependencies
        # the package's own dependencies (numpy etc.) are needed for mypy
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: black (format check)
        run: black --check paramsemble_class/ tests/
      - name: flake8
        run: flake8 paramsemble_class/ tests/
      - name: mypy
        run: mypy paramsemble_class/
